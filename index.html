<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="meta-theme-color" content="#0f172a">
    
    <!-- SEO & METADATA -->
    <title>Hassan Jatoi | Poet • Author • Writer Archive 2026</title>
    <meta name="description" content="Official Archive of Hassan Jatoi. Poet, Author of 'Silent People', and Writer.">
    <link rel="apple-touch-icon" href="https://i.ibb.co/1f4Gqzz4/image.png">

    <!-- ASSETS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Plus+Jakarta+Sans:wght@800&family=Syncopate:wght@700&family=Space+Grotesk:wght@700&family=Playfair+Display:wght@900&family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #000000;
            --text-main: #ffffff;
            --transition-speed: 2s;
            --accent-glow: rgba(255, 255, 255, 0.1);
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            transition: background var(--transition-speed) ease, color var(--transition-speed) ease;
            overflow-x: hidden;
            text-align: center;
        }

        .theme-dark { --bg-color: #000000; --text-main: #ffffff; --accent-glow: rgba(255, 255, 255, 0.1); }
        .theme-royal { --bg-color: #1a1a2e; --text-main: #e94560; --accent-glow: rgba(233, 69, 96, 0.2); }
        .theme-gold { --bg-color: #0f172a; --text-main: #daa520; --accent-glow: rgba(218, 165, 32, 0.2); }
        .theme-clean { --bg-color: #ffffff; --text-main: #000000; --accent-glow: rgba(0, 0, 0, 0.1); }

        .google-nav {
            display: flex;
            justify-content: flex-end;
            padding: 15px 25px;
            gap: 20px;
            align-items: center;
            font-size: 13px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .magic-text {
            background: linear-gradient(to right, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow 10s linear infinite;
        }
        @keyframes rainbow { to { background-position: 400% center; } }

        .brand-logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--text-main);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: 0.5s;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 90%;
            max-width: 584px;
            height: 48px;
            border: 1px solid rgba(128,128,128,0.2);
            border-radius: 24px;
            padding: 0 15px;
            background: white;
            margin: 20px 0;
            color: #000;
        }

        .dynamic-card {
            background: rgba(128, 128, 128, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(128, 128, 128, 0.1);
            border-radius: 30px;
            padding: 20px;
            transition: 0.5s;
            text-align: left;
            overflow: hidden;
        }

        .image-fader {
            position: relative;
            height: 256px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .image-fader img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
        }

        .image-fader img.active {
            opacity: 1;
        }

        .social-chip {
            background: rgba(128, 128, 128, 0.1);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            text-decoration: none !important;
            color: inherit !important;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .social-chip:hover { background: var(--text-main); color: var(--bg-color) !important; }

        .btn-main {
            padding: 10px 20px;
            border-radius: 4px;
            background: #f8f9fa;
            color: #3c4043;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        /* STYLISH FOOTER CSS */
        .premium-footer {
            position: relative;
            padding: 80px 20px;
            margin-top: 50px;
            background: linear-gradient(to top, var(--accent-glow), transparent);
            border-top: 1px solid rgba(128,128,128,0.1);
        }

        .footer-logo-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: inline-block;
            opacity: 0.8;
        }

        .footer-divider {
            width: 150px;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--text-main), transparent);
            margin: 20px auto;
            position: relative;
        }

        .footer-divider::after {
            content: '✦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-color);
            padding: 0 10px;
            font-size: 12px;
        }

        .footer-location {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.6;
        }

        .footer-year-tag {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 15px;
            border: 1px solid rgba(128,128,128,0.3);
            border-radius: 20px;
            font-size: 9px;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .glow-dot {
            height: 6px;
            width: 6px;
            background: var(--text-main);
            border-radius: 50%;
            display: inline-block;
            margin: 0 10px;
            box-shadow: 0 0 10px var(--text-main);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="theme-dark">

    <nav class="google-nav">
        <a href="https://mail.google.com" target="_blank">Gmail</a>
        <a href="https://images.google.com" target="_blank">Images</a>
        <div id="live-clock" class="font-mono font-bold ml-4 opacity-70">00:00:00</div>
        <img src="https://i.ibb.co/1f4Gqzz4/image.png" class="w-10 h-10 rounded-full border-2 border-current ml-4 object-cover">
    </nav>

    <header class="pt-24 flex flex-col items-center">
        <img src="https://i.ibb.co/1f4Gqzz4/image.png" class="brand-logo">
        <h1 class="text-4xl sm:text-5xl font-black uppercase tracking-tighter mb-4">
            Hassan Jatoi <br> <span class="magic-text">Poet • Author • Writer</span>
        </h1>

        <div class="search-box">
            <span class="text-gray-400 pl-2">🔍</span>
            <input type="text" id="aiInput" class="flex-1 bg-transparent border-none outline-none px-3 text-base" placeholder="Hassan Jatoi ke archive mein search karein...">
            <span class="pr-2 opacity-50">🎤</span>
        </div>

        <div class="flex gap-4">
            <button onclick="executeSearch()" class="btn-main">Search Archive</button>
            <button onclick="lucky()" class="btn-main">Lucky Shot</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div class="mb-20">
            <p class="text-[10px] font-black uppercase tracking-[5px] mb-8 opacity-40">Digital Ecosystem</p>
            <div id="social-grid" class="flex flex-wrap justify-center gap-3"></div>
        </div>

        <div class="mb-10 text-center">
            <h2 class="text-3xl font-black uppercase tracking-widest mb-2">The Complete Archive</h2>
            <div class="h-1 w-20 bg-current mx-auto rounded-full mb-10"></div>
        </div>

        <div id="poetry-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <!-- NEW STYLISH FOOTER -->
    <footer class="premium-footer">
        <div class="footer-logo-text">Hassan Jatoi</div>
        <div class="footer-divider"></div>
        <div class="footer-location">
            <span class="glow-dot"></span>
            Pakistan <span class="mx-2">•</span> 2026 Archive
            <span class="glow-dot"></span>
        </div>
        <div class="footer-year-tag uppercase">Official Literary Portfolio</div>
    </footer>

    <script type="module">
        // AAPKI ALBUM SE IMAGES
        const myAlbumImages = [
            "https://i.ibb.co/bZmv1pN/image.png",
            "https://i.ibb.co/998Hy14X/image.png",
            "https://i.ibb.co/qF0yNz6K/image.png",
            "https://i.ibb.co/Z16nJc4C/image.png",
            "https://i.ibb.co/8nhG4wjY/image.png",
            "https://i.ibb.co/TBzb0DKw/image.png",
            "https://i.ibb.co/jP65jbw8/image.png",
            "https://i.ibb.co/5gsw0pw3/image.png",
            "https://i.ibb.co/5xWY1Byv/image.png"
        ];

        const socials = [
            { n: "Portfolio", l: "https://hassanalipoetry.vercel.app/", i: "fa-globe" },
            { n: "Facebook", l: "https://www.facebook.com/share/17zubUQBeE/", i: "fa-facebook" },
            { n: "TikTok", l: "https://www.tiktok.com/@hassanjatoi209", i: "fa-tiktok" },
            { n: "Substack", l: "https://officiallyhassaj.substack.com/", i: "fa-envelope-open-text" },
            { n: "HelloPoetry", l: "https://hellopoetry.com/Hassanjatoi/", i: "fa-pen-nib" },
            { n: "AllPoetry", l: "https://allpoetry.com/Hassan_jatoi", i: "fa-feather" },
            { n: "LinkedIn", l: "https://www.linkedin.com/in/hassanjatoi786", i: "fa-linkedin" },
            { n: "Blog", l: "https://hassan-jatoi.blogspot.com", i: "fa-blogger" },
            { n: "Aruuz", l: "https://www.aruuz.com/?user=Hassanjatoi", i: "fa-scroll" },
            { n: "UrduPoint", l: "https://www.urdupoint.com/poetry/user-poet/hassan-jatoi-27314.html", i: "fa-pen" },
            { n: "HamariWeb", l: "https://mypage.hamariweb.com/userdetail.aspx?id=Y7xcIn2e89o=", i: "fa-address-card" },
            { n: "GitHub", l: "https://github.com/hassanaliuk11-oss", i: "fa-github" }
        ];

        const works = [
            { t: "Silent People", u: "https://hassanaliuk11-oss.github.io/silent-people/" },
            { t: "Death of Spirits", u: "https://hassanaliuk11-oss.github.io/the-death-of-soul/" },
            { t: "Lonely Path", u: "https://hassanaliuk11-oss.github.io/The-Lonely-Path/" },
            { t: "Heart Touching", u: "https://hassanaliuk11-oss.github.io/Heart-Touching/" },
            { t: "Broken Soul", u: "https://hassanaliuk11-oss.github.io/poetry-book1/" },
            { t: "The Visionary", u: "https://hassanaliuk11-oss.github.io/Hassanalipoetry-/" },
            { t: "English Archive", u: "https://hassanaliuk11-oss.github.io/hassanjatoiurdu-/" },
            { t: "Imam Hussein (AS)", u: "https://hassanaliuk11-oss.github.io/Imam-hussein-/" },
            { t: "Blue Horizon", u: "https://hassanaliuk11-oss.github.io/sea-side-and-grief/" },
            { t: "Grief of 2025", u: "https://hassanaliuk11-oss.github.io/The-grief-of-2025/" },
            { t: "Strangers City", u: "https://hassanaliuk11-oss.github.io/The-city-of-strangers-/" },
            { t: "Lyrical Words", u: "https://hassanaliuk11-oss.github.io/my-colourful-words/" }
        ];

        const themes = ['theme-dark', 'theme-royal', 'theme-gold', 'theme-clean'];
        const fonts = ['Plus Jakarta Sans', 'Cinzel', 'Space Grotesk', 'Playfair Display'];
        let tIdx = 0;

        // THEME CHANGER
        setInterval(() => {
            document.body.className = themes[tIdx];
            document.body.style.fontFamily = fonts[tIdx % fonts.length];
            tIdx = (tIdx + 1) % themes.length;
        }, 10000);

        // INJECT SOCIALS
        document.getElementById('social-grid').innerHTML = socials.map(s => `
            <a href="${s.l}" target="_blank" class="social-chip"><i class="fab ${s.i}"></i> ${s.n}</a>
        `).join('');

        // INJECT CARDS
        const grid = document.getElementById('poetry-grid');
        grid.innerHTML = works.map((w, idx) => {
            const shuffled = [...myAlbumImages].sort(() => 0.5 - Math.random());
            const cardImages = shuffled.slice(0, 4); 
            return `
                <div class="dynamic-card group cursor-pointer" onclick="window.open('${w.u}')">
                    <div class="image-fader" id="fader-${idx}">
                        ${cardImages.map((img, i) => `<img src="${img}" class="${i === 0 ? 'active' : ''}">`).join('')}
                    </div>
                    <h3 class="text-2xl font-black uppercase tracking-tighter">${w.t}</h3>
                    <p class="text-[10px] font-bold opacity-40 uppercase mt-2 tracking-widest">Explore Archive</p>
                </div>
            `;
        }).join('');

        // ROTATE IMAGES
        setInterval(() => {
            document.querySelectorAll('.image-fader').forEach(fader => {
                const imgs = fader.querySelectorAll('img');
                const active = fader.querySelector('img.active');
                let next = active.nextElementSibling || imgs[0];
                active.classList.remove('active');
                next.classList.add('active');
            });
        }, 5000);

        // CLOCK & SEARCH
        setInterval(() => { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString(); }, 1000);
        window.executeSearch = () => { const q = document.getElementById('aiInput').value; if(q) window.location.href = `https://www.google.com/search?q=Hassan+Jatoi+${q}`; };
        window.lucky = () => window.location.href = "https://hassanalipoetry.vercel.app/";
    </script>
</body>
</html>
