<style>
:root {
  /* Dynamic Variables Controlled by JavaScript */
  --bg-color: #020617;
  --text-main: #f8fafc;
  --gold-primary: #d4af37;
  --gold-light: #f9e29c;
  --gold-dark: #a67c00;
  --card-bg: rgba(15, 23, 42, 0.6);
  --accent-glow: rgba(212, 175, 55, 0.3);
  --transition-speed: 0.8s;
}
body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  margin: 0;
  overflow-x: hidden;
}

.profile-header {
  position: relative;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.cover-photo {
  width: 100%;
  height: 380px;
  background-size: cover;
  background-position: center;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  position: relative;
  transition: background-image 1s ease-in-out;
}

.cover-photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 60%, var(--bg-color));
}

.profile-info-container {
  margin-top: -100px;
  position: relative;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.profile-pic-wrapper {
    position: relative;
}

.profile-pic-wrapper img {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 7px solid var(--bg-color);
  object-fit: cover;
  background: #1e293b;
}

.verified-badge {
    position: absolute;
    bottom: 15px;
    right: 15px;
    background: #0ea5e9;
    color: white;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid var(--bg-color);
    font-size: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.moti-laker {
  width: 320px;
  height: 6px;
  margin: 25px auto;
  border-radius: 50px;
  background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
  background-size: 400%;
  animation: color-shift 8s linear infinite;
}

@keyframes color-shift {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.btn-gold {
    background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
    background-size: 200% auto;
    color: #1a1a1a !important;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: none;
    box-shadow: 0 4px 15px rgba(184, 134, 11, 0.4);
    transition: 0.5s;
    position: relative;
    overflow: hidden;
}

.btn-gold:hover {
    background-position: right center;
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(184, 134, 11, 0.6);
}

.btn-gold::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: 0.5s;
}

.btn-gold:hover::before {
    left: 100%;
}

.section-title {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  font-weight: 900;
  margin: 4rem 0 2rem;
  text-align: center;
  background: linear-gradient(to right, #fff, var(--gold-primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.glass-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  padding: 1.5rem;
  backdrop-filter: blur(10px);
  transition: all 0.3s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: inherit;
}

.glass-card:hover {
  transform: translateY(-8px);
  border-color: var(--gold-primary);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 10px 30px rgba(184, 134, 11, 0.1);
}

.card-gold-icon {
    color: var(--gold-primary);
    filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5));
}

#gemini-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,0.9);
  backdrop-filter: blur(15px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background: #0f172a;
  border: 1px solid var(--gold-primary);
  border-radius: 24px;
  width: 100%;
  max-width: 600px;
  padding: 30px;
}

.gemini-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 1rem;
  color: white;
  margin-top: 15px;
  height: 100px;
  resize: none;
}

.clear-footer {
  padding: 60px 20px;
  text-align: center;
  border-top: 1px solid rgba(212, 175, 55, 0.3);
  background: linear-gradient(to bottom, transparent, rgba(2, 6, 23, 1));
}

.footer-main-text {
  font-family: 'Cinzel', serif;
  font-weight: 900;
  font-size: 1.75rem;
  letter-spacing: 2px;
  color: #d4af37;
  text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
}

.footer-sub-text {
  color: #cbd5e1;
  font-weight: 800;
  font-size: 0.85rem;
  margin-top: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
</style>
</head>
<body>

<header class="profile-header">
  <div id="dynamic-cover" class="cover-photo"></div>
  <div class="profile-info-container">
    <div class="profile-pic-wrapper">
      <img src="https://i.ibb.co/S4ygvhJ3/image.png" alt="Hassan Jatoi">
      <div class="verified-badge" title="Verified Author">
          <i class="fa-solid fa-check"></i>
      </div>
    </div>
    <div class="profile-details text-center">
      <h1 class="font-cinzel text-4xl md:text-6xl font-black mt-6">Hassan Jatoi</h1>
      <p class="text-slate-400 font-bold tracking-[0.3em] text-xs mt-2 uppercase">Verified Poet & Author</p>
      
      <div class="moti-laker"></div>
      
      <div class="flex flex-wrap justify-center gap-4 mt-4 px-4">
        <a href="https://wa.me/923083500829" target="_blank" class="btn-gold px-8 py-3 rounded-full flex items-center gap-2">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://www.youtube.com/@poetrybyhassanjatoi" target="_blank" class="btn-gold px-8 py-3 rounded-full flex items-center gap-2">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>
        <a href="https://chat.google.com/app/home" target="_blank" class="btn-gold px-8 py-3 rounded-full flex items-center gap-2">
            <i class="fa-solid fa-comments"></i> Google Chat
        </a>
      </div>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 pb-20">
  <section>
    <h2 class="section-title cursor-pointer" onclick="toggleGeminiModal()">
        <i class="fa-solid fa-star card-gold-icon mr-2"></i> Verified Social Presence
    </h2>
    <div id="social-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-4"></div>
  </section>

  <section>
    <h2 class="section-title">
        <i class="fa-solid fa-book-open card-gold-icon mr-2"></i> Official Poetry Books
    </h2>
    <div id="works-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </section>
</main>

<div id="gemini-modal">
  <div class="modal-content">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-cinzel text-xl font-bold text-gold-primary" style="color: #d4af37">AI Expert</h3>
      <button onclick="toggleGeminiModal()" class="text-slate-500 hover:text-white">✕</button>
    </div>
    <textarea id="gemini-query" class="gemini-input" placeholder="Ask about Hassan Jatoi's work..."></textarea>
    <button onclick="askGemini()" class="btn-gold w-full py-3 rounded-xl mt-4">SEARCH GOOGLE</button>
    <div id="gemini-loading" class="hidden mt-4 text-center text-gold-primary animate-pulse" style="color: #d4af37">Collecting Information...</div>
    <div id="gemini-result" class="mt-4 p-4 bg-slate-800/50 rounded-xl text-sm hidden border border-gold-primary/20"></div>
  </div>
</div>

<footer class="clear-footer">
    <p class="footer-main-text">HASSAN JATOI</p>
    <p class="footer-sub-text">© 2026 OFFICIAL VERIFIED ARCHIVE • HASSANALIPOETRY</p>
</footer>

<script>
  const apiKey = ""; 

  const socials = [
    { n: "Google Search", l: "https://www.google.com/search?q=hassan+jatoi+poetry", i: "fa-google" },
    { n: "Verification", l: "https://share.google/Lhfqntq93WW6E8Dr3", i: "fa-shield-check" },
    { n: "X (Twitter)", l: "https://x.com/Ghostwrite90722", i: "fa-x-twitter" },
    { n: "Facebook", l: "https://www.facebook.com/share/17zubUQBeE/", i: "fa-facebook-f" },
    { n: "TikTok", l: "https://www.tiktok.com/@hassanjatoi209", i: "fa-tiktok" },
    { n: "YouTube", l: "https://www.youtube.com/@poetrybyhassanjatoi", i: "fa-youtube" },
    { n: "WhatsApp", l: "https://wa.me/923083500829", i: "fa-whatsapp" },
    { n: "LinkedIn", l: "https://www.linkedin.com/in/hassanjatoi786", i: "fa-linkedin-in" },
    { n: "GitHub", l: "https://github.com/hassanaliuk11-oss", i: "fa-github" },
    { n: "HelloPoetry", l: "https://hellopoetry.com/Hassanjatoi/", i: "fa-pen-nib" },
    { n: "UrduPoint", l: "https://www.urdupoint.com/poetry/user-poet/hassan-jatoi-27314.html", i: "fa-feather" },
    { n: "Aruuz", l: "https://www.aruuz.com/?user=Hassanjatoi", i: "fa-pen-fancy" }
  ];

  const sGrid = document.getElementById('social-grid');
  socials.forEach(s => {
    const card = document.createElement('a');
    card.href = s.l; card.target = "_blank"; card.className = "glass-card";
    const isBrand = ['google', 'facebook', 'tiktok', 'youtube', 'whatsapp', 'linkedin', 'github', 'x-twitter'].some(b => s.i.includes(b));
    const iconClass = (isBrand ? 'fa-brands ' : 'fa-solid ') + s.i;
    card.innerHTML = `<i class="${iconClass} text-2xl mb-2 card-gold-icon"></i><span class="text-[10px] font-bold uppercase">${s.n}</span>`;
    sGrid.appendChild(card);
  });

  const works = [
    { t: "Silent People", u: "https://hassanaliuk11-oss.github.io/silent-people/" },
    { t: "Death of Spirits", u: "https://hassanaliuk11-oss.github.io/the-death-of-soul/" },
    { t: "Lonely Path", u: "https://hassanaliuk11-oss.github.io/The-Lonely-Path/" },
    { t: "Heart Touching", u: "https://hassanaliuk11-oss.github.io/Heart-Touching/" },
    { t: "Broken Soul", u: "https://hassanaliuk11-oss.github.io/poetry-book1/" },
    { t: "The Visionary", u: "https://hassanaliuk11-oss.github.io/Hassanalipoetry-/" },
    { t: "English Archive", u: "https://hassanaliuk11-oss.github.io/hassanjatoiurdu-/" },
    { t: "Blue Horizon", u: "https://hassanaliuk11-oss.github.io/sea-side-and-grief/" }
  ];

  const wGrid = document.getElementById('works-grid');
  works.forEach(w => {
    const card = document.createElement('a');
    card.href = w.u; card.target = "_blank"; card.className = "glass-card text-center";
    card.innerHTML = `<h4 class="font-cinzel text-md font-bold text-slate-100">${w.t}</h4><p class="text-[9px] text-gold-primary opacity-60 uppercase mt-1">Official Book</p>`;
    wGrid.appendChild(card);
  });

  async function askGemini() {
    const query = document.getElementById('gemini-query').value;
    const resultBox = document.getElementById('gemini-result');
    const loading = document.getElementById('gemini-loading');
    if (!query) return;

    resultBox.style.display = 'none';
    loading.classList.remove('hidden');

    const systemPrompt = `You are the Official AI Expert for Hassan Jatoi. Use GOOGLE SEARCH to verify all details about his books like 'Silent People' and 'Death of Spirits', his social media, and his presence as a verified poet. Respond in a poetic, professional manner.`;

    try {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: query }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          tools: [{ "google_search": {} }]
        })
      });
      const data = await res.json();
      loading.classList.add('hidden');
      resultBox.innerHTML = data.candidates?.[0]?.content?.parts?.[0]?.text?.replace(/\n/g, '<br>') || "Search results unavailable.";
      resultBox.style.display = 'block';
    } catch (e) {
      loading.classList.add('hidden');
      resultBox.textContent = "Neural connection failed. Please try again.";
      resultBox.style.display = 'block';
    }
  }

  function toggleGeminiModal() {
    const m = document.getElementById('gemini-modal');
    m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
  }

  const album = [
    "https://i.ibb.co/gZBLPfsj/image.png", 
    "https://i.ibb.co/v4np474r/image.png", 
    "https://i.ibb.co/QFzfbKx4/image.png",
    "https://i.ibb.co/60rLbPTW/image.png",
    "https://i.ibb.co/23Thbqtc/image.png"
  ];
  let currentImgIndex = 0;
  function rotateCover() {
    const cover = document.getElementById('dynamic-cover');
    if (cover) {
        cover.style.backgroundImage = `url('${album[currentImgIndex]}')`;
        currentImgIndex = (currentImgIndex + 1) % album.length;
    }
  }

  window.onload = () => { rotateCover(); setInterval(rotateCover, 4000); };
</script>
</body>
</html>
