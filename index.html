<style>
:root {
  --bg-color: #020617;
  --text-main: #f8fafc;
  --accent-primary: #0ea5e9; 
  --accent-light: #7dd3fc;
  --accent-dark: #0369a1;
  --glass-bg: rgba(15, 23, 42, 0.7);
  --card-border: rgba(255, 255, 255, 0.08);
}

* {
  -webkit-tap-highlight-color: transparent;
  box-sizing: border-box;
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Inter', sans-serif;
  margin: 0;
  overflow-x: hidden;
  line-height: 1.6;
}

/* Background Particles Effect */
#canvas-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

/* Scroll Animation */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s cubic-bezier(0.2, 1, 0.3, 1);
}
.reveal.active {
  opacity: 1;
  transform: translateY(0);
}

.profile-header {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

.cover-photo {
  width: 100%;
  height: 45vh;
  min-height: 350px;
  background-size: cover;
  background-position: center;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
  position: relative;
  transition: background-image 1.5s ease-in-out;
  background-color: #0f172a;
}

.cover-photo::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 10%, var(--bg-color) 100%);
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
}

.profile-pic-wrapper {
  position: relative;
  width: 160px;
  margin: -80px auto 0;
  z-index: 20;
}

@media (min-width: 768px) {
  .profile-pic-wrapper { width: 200px; margin-top: -100px; }
}

.profile-pic-wrapper img {
  width: 100%;
  aspect-ratio: 1/1;
  border-radius: 50%;
  border: 5px solid var(--bg-color);
  object-fit: cover;
  box-shadow: 0 0 30px rgba(14, 165, 233, 0.3);
  background: var(--bg-color);
}

.verified-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: #0ea5e9;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid var(--bg-color);
    font-size: 13px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.moti-laker {
  width: 60%;
  max-width: 300px;
  height: 3px;
  margin: 15px auto;
  border-radius: 50px;
  background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
  opacity: 0.6;
}

.btn-blue {
    background: rgba(14, 165, 233, 0.05);
    border: 1px solid rgba(14, 165, 233, 0.2);
    color: white !important;
    font-weight: 600;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

.btn-blue:hover {
    background: var(--accent-primary);
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(14, 165, 233, 0.2);
}

.section-title {
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  letter-spacing: 3px;
  margin: 4rem 0 2rem;
  text-align: center;
  color: #fff;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
}

.section-title::before, .section-title::after {
    content: '';
    height: 1px;
    width: 30px;
    background: var(--accent-primary);
    opacity: 0.5;
}

.glass-card {
  background: var(--glass-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 1.25rem;
  backdrop-filter: blur(10px);
  transition: all 0.4s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
}

.glass-card:hover {
  border-color: var(--accent-primary);
  background: rgba(14, 165, 233, 0.08);
  transform: translateY(-5px);
}

.icon-box {
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(14, 165, 233, 0.1);
    margin-bottom: 10px;
    color: var(--accent-primary);
    font-size: 1.2rem;
}

/* Grids */
.grid-social {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}
@media (min-width: 640px) { .grid-social { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1024px) { .grid-social { grid-template-columns: repeat(6, 1fr); } }

.grid-books {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
}
@media (min-width: 640px) { .grid-books { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-books { grid-template-columns: repeat(4, 1fr); } }

/* Hidden AI Trigger */
.secret-trigger {
    cursor: pointer;
    user-select: none;
    transition: opacity 0.3s;
}
.secret-trigger:active { opacity: 0.7; }

#gemini-modal {
  display: none; 
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(2, 6, 23, 0.95);
  backdrop-filter: blur(20px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background: #0f172a;
  border: 1px solid rgba(14, 165, 233, 0.3);
  border-radius: 24px;
  width: 100%;
  max-width: 500px;
  padding: 25px;
}

.gemini-input {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 15px;
  padding: 1rem;
  color: white;
  margin-top: 10px;
  height: 80px;
  resize: none;
  font-size: 14px;
}

.clear-footer {
  padding: 60px 20px;
  text-align: center;
}

.footer-text {
    font-family: 'Cinzel', serif;
    color: var(--accent-primary);
    font-weight: 900;
    font-size: 1.4rem;
    letter-spacing: 4px;
}
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>

<header class="profile-header">
  <div id="dynamic-cover" class="cover-photo"></div>
  <div class="px-4">
    <div class="profile-pic-wrapper reveal">
      <img src="https://i.ibb.co/S4ygvhJ3/image.png" alt="Hassan Jatoi">
      <div class="verified-badge">
          <i class="fa-solid fa-check"></i>

    </div>
    <div class="profile-details text-center reveal">
      <h1 class="font-cinzel text-4xl md:text-5xl font-black mt-4 text-white">Hassan Jatoi</h1>
      <p class="text-sky-400/80 font-bold tracking-[0.5em] text-[10px] mt-2 uppercase">Poet & Author</p>
      
      <div class="moti-laker"></div>

        <a href="https://wa.me/923083500829" target="_blank" class="btn-blue px-6 py-2.5 rounded-xl flex items-center gap-2 text-xs">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://www.youtube.com/@poetrybyhassanjatoi" target="_blank" class="btn-blue px-6 py-2.5 rounded-xl flex items-center gap-2 text-xs">
            <i class="fa-brands fa-youtube"></i> YouTube
        </a>
      </div>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-5 pb-20">
  <!-- Poetry Collection - Moved to TOP -->
  <section class="reveal">
    <h2 class="section-title">Poetry Collection</h2>
    <div id="works-grid" class="grid-books"></div>
  </section>

  <!-- Verified Channels - Moved to BOTTOM -->
  <section class="reveal">
    <h2 class="section-title">Verified Channels</h2>
    <div id="social-grid" class="grid-social"></div>
  </section>
</main>

<!-- Secret AI Modal -->
<div id="gemini-modal">
  <div class="modal-content">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-cinzel text-lg font-bold text-sky-400">AI Intelligence</h3>
      <button onclick="toggleGeminiModal()" class="text-slate-500 hover:text-white text-3xl">&times;</button>
    </div>
    <textarea id="gemini-query" class="gemini-input" placeholder="Ask about Hassan Jatoi..."></textarea>
    <button onclick="askGemini()" class="btn-blue w-full py-3 rounded-xl mt-4 font-bold text-sm tracking-widest uppercase">Search Database</button>
    <div id="gemini-loading" class="hidden mt-4 text-center text-sky-500 text-xs animate-pulse">
        <i class="fa-solid fa-microchip fa-spin mr-2"></i> Fetching Verified Data...
    </div>
    <div id="gemini-result" class="mt-4 p-4 bg-slate-900/50 rounded-xl text-xs hidden border border-sky-500/20 overflow-y-auto max-h-48 text-slate-300"></div>
  </div>
</div>

<footer class="clear-footer">
    <p class="footer-text secret-trigger" onclick="toggleGeminiModal()">HASSAN JATOI</p>
    <p class="text-slate-600 text-[9px] font-bold tracking-[0.2em] mt-2 uppercase">Official Digital Footprint © 2026</p>
</footer>

<script>
  const apiKey = ""; 
  const backgroundSystemPrompt = `You are the Official AI Expert for Hassan Jatoi. Use GOOGLE SEARCH to verify his books like 'Silent People' and 'Death of Spirits', and his social media presence. Answer professionally.`;

  const socials = [
    { n: "Google", l: "https://www.google.com/search?q=hassan+jatoi+poetry", i: "fa-google" },
    { n: "Verified", l: "https://share.google/Lhfqntq93WW6E8Dr3", i: "fa-circle-check" }, 
    { n: "X", l: "https://x.com/Ghostwrite90722", i: "fa-x-twitter" }, 
    { n: "Facebook", l: "https://www.facebook.com/share/17zubUQBeE/", i: "fa-facebook-f" },
    { n: "TikTok", l: "https://www.tiktok.com/@hassanjatoi209", i: "fa-tiktok" },
    { n: "YouTube", l: "https://youtube.com/@oxfordenglish3?si=mr5H2YmJoZMGcFNz", i: "fa-youtube" },
    { n: "WhatsApp", l: "https://wa.me/923083500829", i: "fa-whatsapp" },
    { n: "LinkedIn", l: "https://www.linkedin.com/in/hassanjatoi786", i: "fa-linkedin-in" },
    { n: "GitHub", l: "https://github.com/hassanaliuk11-oss", i: "fa-github" },
    { n: "HelloPoetry", l: "https://hellopoetry.com/Hassanjatoi/", i: "fa-feather" },
    { n: "UrduPoint", l: "https://www.urdupoint.com/poetry/user-poet/hassan-jatoi-27314.html", i: "fa-pen-nib" },
    { n: "Aruuz", l: "https://www.aruuz.com/?user=Hassanjatoi", i: "fa-scroll" }
  ];

const works = [
    { t: "Registration For Course", u: "https://hassanaliuk11-oss.github.io/oxford/"},
    { t: "Oxford English Course", u: "https://oxford-english-course.vercel.app/" },
    { t: "all jobs website Course", u: "https://hassanaliuk11-oss.github.io/Pdf-books/" },
    { t: "Oxford English Course", u: "https://hassanaliuk11-oss.github.io/Oxford-English-Course-/" },
    { t: "Tears In Eye's", u: "https://hassanaliuk11-oss.github.io/silent-people/" },
    { t: "Death of Spirits", u: "https://hassanaliuk11-oss.github.io/the-death-of-soul/" },
    { t: "Lonely Path", u: "https://hassanaliuk11-oss.github.io/The-Lonely-Path/" },
    { t: "Sepration", u: "https://hassanaliuk11-oss.github.io/Heart-Touching/" },
    { t: "Broken Soul", u: "https://hassanaliuk11-oss.github.io/poetry-book1/" },
    { t: "Urdu Poetry", u: "https://hassanaliuk11-oss.github.io/hassanjatoiurdu-/" },
    { t: "Blue Horizon", u: "https://hassanaliuk11-oss.github.io/sea-side-and-grief/" },
    { t: "Colourful Words", u: "https://hassanaliuk11-oss.github.io/my-colourful-words/" },
    { t: "YouTube Gallery", u: "https://hassanaliuk11-oss.github.io/utube/" }
];
  // Background Particles
  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  let particles = [];
  function initParticles() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    particles = [];
    for(let i=0; i<50; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2,
            speedY: Math.random() * 0.5 + 0.1,
            opacity: Math.random() * 0.5
        });
    }
  }
  function animateParticles() {
    ctx.clearRect(0,0, canvas.width, canvas.height);
    particles.forEach(p => {
        ctx.fillStyle = `rgba(14, 165, 233, ${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        p.y -= p.speedY;
        if(p.y < -10) p.y = canvas.height + 10;
    });
    requestAnimationFrame(animateParticles);
  }

  function initUI() {
    const sGrid = document.getElementById('social-grid');
    socials.forEach(s => {
      const card = document.createElement('a');
      card.href = s.l; card.target = "_blank"; card.className = "glass-card";
      const isBrand = ['google', 'facebook', 'tiktok', 'youtube', 'whatsapp', 'linkedin', 'github', 'x-twitter'].some(b => s.i.includes(b));
      card.innerHTML = `<div class="icon-box"><i class="${(isBrand?'fa-brands ':'fa-solid ')+s.i}"></i></div><span class="text-[9px] font-bold uppercase tracking-widest text-slate-400">${s.n}</span>`;
      sGrid.appendChild(card);
    });

    const wGrid = document.getElementById('works-grid');
    works.forEach(w => {
      const card = document.createElement('a');
      card.href = w.u; card.target = "_blank"; card.className = "glass-card group";
      card.innerHTML = `<h4 class="font-cinzel text-sm font-bold text-white group-hover:text-sky-400">${w.t}</h4><div class="mt-2 text-[7px] text-sky-500/60 font-black uppercase tracking-widest">Verified Work</div>`;
      wGrid.appendChild(card);
    });
  }

  function reveal() {
    var reveals = document.querySelectorAll(".reveal");
    reveals.forEach(r => {
      if (r.getBoundingClientRect().top < window.innerHeight - 50) r.classList.add("active");
    });
  }

  async function askGemini() {
    const query = document.getElementById('gemini-query').value;
    const resultBox = document.getElementById('gemini-result');
    const loading = document.getElementById('gemini-loading');
    if (!query) return;
    resultBox.style.display = 'none';
    loading.classList.remove('hidden');
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: query }] }],
          systemInstruction: { parts: [{ text: backgroundSystemPrompt }] },
          tools: [{ "google_search": {} }]
        })
      });
      const data = await response.json();
      loading.classList.add('hidden');
      resultBox.innerHTML = (data.candidates?.[0]?.content?.parts?.[0]?.text || "No data found.").replace(/\n/g, '<br>');
      resultBox.style.display = 'block';
    } catch (e) {
      loading.classList.add('hidden');
      resultBox.textContent = "Error.";
      resultBox.style.display = 'block';
    }
  }

  function toggleGeminiModal() {
    const m = document.getElementById('gemini-modal');
    m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
  }

  const album = [
    "https://i.ibb.co/gZBLPfsj/image.png", "https://i.ibb.co/v4np474r/image.png", 
    "https://i.ibb.co/QFzfbKx4/image.png", "https://i.ibb.co/60rLbPTW/image.png", "https://i.ibb.co/23Thbqtc/image.png"
  ];
  let cur = 0;
  function rotate() {
    const c = document.getElementById('dynamic-cover');
    if(c) { c.style.backgroundImage = `url('${album[cur]}')`; cur = (cur+1)%album.length; }
  }

  window.addEventListener("scroll", reveal);
  window.addEventListener("resize", initParticles);
  window.onload = () => { 
    initUI(); rotate(); initParticles(); animateParticles();
    setInterval(rotate, 6000);
    setTimeout(reveal, 100);
  };
</script>
</body>
 </html>
